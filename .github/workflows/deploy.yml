name: Auto Deploy to Live Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hostomy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to Live Server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/config/database.php
            **/start-server.bat
            **/deploy-to-xampp.bat
            **/deploy-exclude.txt
            **/README.md
            **/.github/**