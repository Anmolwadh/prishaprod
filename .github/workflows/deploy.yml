name: Auto Deploy to Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostomy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check FTP Configuration
        id: check_ftp
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice title=Repository Synced::Code is safely synced in GitHub. Add FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD in repository secrets to enable automatic FTP transfer to live hosting."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync Files to Live Server via FTP
        if: steps.check_ftp.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/config/database.php
            **/start-server.bat
            **/stop-server.bat
            **/deploy.bat
            **/deploy-to-xampp.bat
            **/deploy-exclude.txt
            **/README.md
            **/.github/**

      - name: Deployment Status
        run: |
          if [ "${{ steps.check_ftp.outputs.configured }}" = "true" ]; then
            echo "Successfully deployed to live server!"
          else
            echo "Repository successfully updated and verified."
          fi