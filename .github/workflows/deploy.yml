name: Auto Deploy to Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostomy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check FTP Connection
        id: test_ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_PASS" ]; then
            echo "ftp_ready=false" >> $GITHUB_OUTPUT
            echo "reason=FTP secrets not yet added to GitHub Settings" >> $GITHUB_OUTPUT
            echo "::notice title=FTP Setup Pending::FTP secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD) are not yet configured in repository settings. Code has been safely synced to GitHub."
            exit 0
          fi

          echo "Testing FTP connection to $FTP_SERVER..."
          if curl --connect-timeout 10 --max-time 15 -s "ftp://$FTP_SERVER/" --user "$FTP_USER:$FTP_PASS" > /dev/null 2>&1; then
            echo "ftp_ready=true" >> $GITHUB_OUTPUT
            echo "FTP connection successful!"
          else
            echo "ftp_ready=false" >> $GITHUB_OUTPUT
            echo "reason=Could not authenticate to FTP server with current credentials" >> $GITHUB_OUTPUT
            echo "::warning title=FTP Auth::Could not connect to $FTP_SERVER with the provided credentials."
          fi

      - name: Sync Files to Live Server via FTP
        if: steps.test_ftp.outputs.ftp_ready == 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/config/database.php
            **/start-server.bat
            **/stop-server.bat
            **/deploy.bat
            **/deploy-to-xampp.bat
            **/deploy-exclude.txt
            **/README.md
            **/.github/**

      - name: Deployment Result
        run: |
          if [ "${{ steps.test_ftp.outputs.ftp_ready }}" = "true" ]; then
            echo "✅ Live server deployment completed successfully!"
          else
            echo "ℹ️ Repository is up to date on GitHub. (${{ steps.test_ftp.outputs.reason }})"
          fi