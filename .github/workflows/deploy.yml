name: Auto Deploy to Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostomy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify FTP Credentials
        id: check_ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error title=Missing FTP Credentials::Cannot deploy to live server. Please add FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD to GitHub Secrets (https://github.com/Anmolwadh/prishaprod/settings/secrets/actions)."
            exit 1
          fi

      - name: Sync Files to Live Server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/config/database.php
            **/start-server.bat
            **/stop-server.bat
            **/deploy.bat
            **/deploy-to-xampp.bat
            **/deploy-exclude.txt
            **/README.md
            **/.github/**